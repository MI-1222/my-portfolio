name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 静的アセットのビルド検証および静的解析。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト。
        uses: actions/checkout@v4

      - name: pnpm のセットアップ。
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.js 環境のセットアップ。
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 依存パッケージのインストール。
        run: pnpm install --frozen-lockfile

      - name: 静的コード解析（Lint）。
        run: pnpm run lint

      - name: Astro プロジェクトのビルド。
        run: pnpm run build
